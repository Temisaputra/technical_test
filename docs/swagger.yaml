        type: array
      name:
        type: string
      nick_name:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  presenter.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
    type: object
  response.Meta:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_data:
        type: integer
      total_page:
        type: integer
    type: object
