      group_name:
        type: string
      id:
        type: integer
      value:
        type: string
    type: object
  presenter.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  presenter.LoginResponse:
