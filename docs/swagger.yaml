basePath: /api/war-onk
definitions:
  helper.Response:
    properties:
      data: {}
      message:
        type: string
      meta: {}
      status:
        type: integer
    type: object
  presenter.AddressRequest:
    properties:
      address:
        type: string
      main:
        type: boolean
      name:
        type: string
    required:
    - address
    - name
    type: object
  presenter.AddressResponse:
    properties:
      address:
        type: string
      id:
        type: integer
      main:
        type: boolean
      name:
        type: string
      supplier_id:
        type: integer
    type: object
  presenter.ApprovalCreateRequest:
    properties:
      sla_hours:
        type: integer
      stage:
        description: Draft, In Review, In Assessment, Active
        type: string
      status:
        description: 'default: In Progress'
        type: string
      steps:
        items:
          $ref: '#/definitions/presenter.ApprovalStepRequest'
        type: array
      supplier_id:
        type: integer
    required:
    - stage
    - steps
    - supplier_id
    type: object
  presenter.ApprovalLogCreateRequest:
    properties:
      action:
        description: Approve, Return, Comment
        type: string
      notes:
        type: string
      role:
        type: string
      user:
        type: string
      workflow_id:
        type: integer
    required:
    - action
    - role
    - user
    type: object
  presenter.ApprovalLogResponse:
    properties:
      action:
        type: string
      created_at:
        type: string
      id:
        type: integer
      notes:
        type: string
      role:
        type: string
      user:
        type: string
      workflow_id:
        type: integer
    type: object
  presenter.ApprovalResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      sla_hours:
        type: integer
      stage:
        type: string
      status:
        type: string
      supplier_id:
        type: integer
      updated_at:
        type: string
    type: object
  presenter.ApprovalStepRequest:
    properties:
      assigned_to:
        description: 'optional: kalau assign user tertentu'
        type: integer
      role:
        description: e.g. Sales, Marketing, Data Management
        type: string
      sla_hours:
        type: integer
      step_order:
        type: integer
    required:
    - role
    - step_order
    type: object
  presenter.ApprovalUpdateRequest:
    properties:
      id:
        type: integer
      reviewer:
        $ref: '#/definitions/presenter.ApprovalLogCreateRequest'
      sla_hours:
        type: integer
      stage:
        type: string
      status:
        type: string
      supplier_id:
        type: integer
    required:
    - id
    - reviewer
    - supplier_id
    type: object
  presenter.ContactRequest:
    properties:
      email:
